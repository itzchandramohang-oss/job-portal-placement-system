<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Launchpad</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/main.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark">L</span> launchpad</a>
    <a class="text-link" href="login.html">Log in <span>→</span></a>
  </header>

  <main class="auth-layout">
    <section class="auth-card">
      <span class="eyebrow">YOUR NEXT CHAPTER</span>
      <h1>Create your account.</h1>
      <p class="auth-subtitle">Build your profile and find a role that fits.</p>
      <form id="register-form" class="form-stack">
        <label>Full name
          <input type="text" name="name" placeholder="Your name" required autocomplete="name">
        </label>
        <label>Email address
          <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </label>
        <label>Password
          <input type="password" name="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </label>
        <button class="button button-wide" type="submit">Create account <span>→</span></button>
        <p class="form-message" aria-live="polite"></p>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      <p class="demo-hint">This starter stores demo accounts in this browser only.</p>
    </section>
  </main>

  <footer class="site-footer">
    <a class="brand" href="../index.html"><span class="brand-mark">L</span> launchpad</a>
    <span>© <span data-year></span> Launchpad</span>
  </footer>
</body>
</html>
